services:
  wall-of-tracks:
    build: .
    ports:
      - "3000:3000"
    # Credentials are injected at runtime from .env. They are never copied
    # into the image and never written in this file.
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
