    <rect x="350" y="1160" width="200" height="6" rx="3" fill="#ffffff" opacity="0.38"/>
    <circle cx="398" cy="1216" r="15" fill="#ffffff" opacity="0.55"/>
    <circle cx="450" cy="1216" r="22" fill="#ffffff" opacity="0.85"/>
    <circle cx="510" cy="1216" r="15" fill="#ffffff" opacity="0.55"/>
