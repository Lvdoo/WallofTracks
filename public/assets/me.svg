<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1350" width="900" height="1350" role="img" aria-label="Fallback scene: a dark portrait with a phone lying in the lower middle">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#111a38"/>
      <stop offset="0.45" stop-color="#1a1436"/>
      <stop offset="1" stop-color="#05070f"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#7fa8ff" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#7a6bff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="phoneBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3150"/>
      <stop offset="0.5" stop-color="#141a2e"/>
      <stop offset="1" stop-color="#070a14"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fc4ff"/>
      <stop offset="0.45" stop-color="#b48cff"/>
      <stop offset="1" stop-color="#2c3c86"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="tiny" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="900" height="1350" fill="url(#bg)"/>
  <rect width="900" height="1350" fill="url(#halo)"/>
  <g opacity="0.92">
    <ellipse cx="450" cy="440" rx="158" ry="192" fill="#0c1124"/>
    <path d="M120 1350 C150 880 275 660 450 660 C625 660 750 880 780 1350 Z" fill="#0a0e1e"/>
  </g>
  <ellipse cx="450" cy="1010" rx="330" ry="300" fill="#6fa8ff" opacity="0.16" filter="url(#soft)"/>
  <g transform="rotate(-7 450 1010)">
