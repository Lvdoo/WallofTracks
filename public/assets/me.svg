    <rect x="292" y="772" width="316" height="500" rx="52" fill="url(#phoneBody)" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3"/>
    <rect x="308" y="790" width="284" height="464" rx="40" fill="url(#screen)" opacity="0.9"/>
