<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080a12">
  <title>What your music looks like</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="is-loading">
  <div class="scene" id="scene">

    <!-- Background photo (me.jpg, with me.svg fallback) and scene grading. -->
    <div class="scene__photo" id="scenePhoto" aria-hidden="true"></div>
    <div class="scene__grade" aria-hidden="true"></div>
    <div class="scene__grain" aria-hidden="true"></div>

    <!-- Light and shadow that make the cards feel physically inside the photo. -->
    <div class="surface-glow" aria-hidden="true"></div>
    <div class="light-cone" aria-hidden="true"></div>
    <div class="cast-shadow" aria-hidden="true"></div>
    <div class="contact-line" aria-hidden="true"></div>
    <div class="phone-glow" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">◉</span>
        <div>
          <h1 class="brand__title">What your music looks like</h1>
          <p class="brand__sub">Recent listens from <span id="username">…</span></p>
        </div>
      </div>
      <div class="meta">
        <span class="status" id="status">
          <i class="status__dot" aria-hidden="true"></i><span id="statusText">Loading</span>
        </span>
        <span class="meta__line">
          <span class="meta__counter" id="counter">1 / 0</span>
          <span class="meta__time" id="refreshTime">—</span>
        </span>
      </div>
    </header>

    <main class="stage" id="stage" aria-label="Recent music player cards">
      <div class="deck" id="deck"></div>

      <!-- Friendly empty / error state when there is nothing to show. -->
      <section class="state-card" id="stateCard" hidden>
        <div class="state-card__icon" id="stateIcon" aria-hidden="true">♪</div>
        <h2 id="stateTitle"></h2>
        <p id="stateBody"></p>
        <button class="state-card__button" id="stateRetry" type="button" hidden>Try again</button>
      </section>
    </main>

    <p class="hint" id="hint">Scroll, swipe or use ← → to turn the cards</p>
    <button class="back" id="backButton" type="button" hidden>↩ Back to phone</button>

    <div class="banner" id="banner" hidden>
      <span id="bannerText"></span>
      <button type="button" id="retryButton">Retry</button>
    </div>

    <!-- ?debug=1: click/drag the photo, tune scale and wheel radius. -->
    <aside class="debug" id="debugPanel" hidden>
      <strong>Photo integration debug</strong>
      <p>Click or drag on the photo to place the phone anchor.</p>
      <code id="debugValues"></code>
      <label class="debug__row">
        <span>Card scale <output id="scaleOut">1.00</output></span>
        <input id="scaleSlider" type="range" min="0.5" max="1.6" step="0.05" value="1">
      </label>
      <label class="debug__row">
        <span>Wheel radius <output id="radiusOut">1.00×</output></span>
        <input id="radiusSlider" type="range" min="0.5" max="2" step="0.05" value="1">
      </label>
    </aside>
    <div class="debug-overlay" id="debugOverlay" hidden></div>
  </div>

  <script src="/app.js" defer></script>
</body>
</html>
