<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080a12">
  <title>What your music looks like</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="is-loading">
  <div class="scene" id="scene">

    <!-- The stage owns the photo, its crop and every stage-relative position. -->
    <main class="stage" id="stage" aria-label="Your recent listens, from newest to oldest">
      <div class="stage__photo" id="scenePhoto" aria-hidden="true"></div>
      <div class="stage__grade" aria-hidden="true"></div>
      <div class="stage__grain" aria-hidden="true"></div>

      <!-- Only the photo's own halo is augmented; no second light cone. -->
      <div class="light-spill" aria-hidden="true"></div>
      <div class="contact-glow" aria-hidden="true"></div>
      <div class="contact-line" aria-hidden="true"></div>
      <div class="jacket-reflection" aria-hidden="true"></div>

      <div class="deck" id="deck"></div>

      <!-- Friendly empty / error state when there is nothing to show. -->
      <section class="state-card" id="stateCard" hidden>
        <div class="state-card__icon" id="stateIcon" aria-hidden="true">♪</div>
        <h2 id="stateTitle"></h2>
        <p id="stateBody"></p>
        <button class="state-card__button" id="stateRetry" type="button" hidden>Try again</button>
      </section>
    </main>

    <header class="topbar">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">◉</span>
        <div>
          <h1 class="brand__title">What your music looks like</h1>
          <p class="brand__sub">Recent listens from <span id="username">…</span></p>
        </div>
      </div>
      <div class="meta">
        <span class="status" id="status">
          <i class="status__dot" aria-hidden="true"></i><span id="statusText">Loading</span>
        </span>
        <span class="meta__line">
          <span class="meta__counter" id="counter">1 / 0</span>
          <span class="meta__time" id="refreshTime">—</span>
        </span>
      </div>
    </header>

    <p class="hint" id="hint">Scroll anywhere or swipe to see the Saturn ring · ← → also work</p>

    <!-- Full, untruncated details of the selected track. Never a click target. -->
    <figure class="caption" id="caption" aria-live="polite">
      <div class="caption__meta">
        <span class="caption__rank" id="captionRank">#1</span>
        <span class="caption__plays" id="captionPlays"></span>
      </div>
      <figcaption class="caption__title caption__text" id="captionTitle"></figcaption>
      <div class="caption__artists caption__text" id="captionArtists"></div>
    </figure>

    <button class="back" id="backButton" type="button" hidden>↩ Back to phone</button>

    <div class="banner" id="banner" hidden>
      <span id="bannerText"></span>
      <button type="button" id="retryButton">Retry</button>
    </div>

    <!-- ?debug=1: tune the photo anchor, the Saturn ring and hit areas. -->
    <aside class="debug" id="debugPanel" hidden>
      <strong>Photo + ring debug</strong>
      <p>Cards stay clickable. Tick “Pick anchor” only when you want to click or drag the photo.</p>
      <code id="debugValues"></code>
      <label class="debug__row">
        <span>Card scale <output id="scaleOut">1.00</output></span>
        <input id="scaleSlider" type="range" min="0.5" max="1.6" step="0.05" value="1">
      </label>
      <label class="debug__row">
        <span>Ring radius X <output id="ringRxOut">52%</output></span>
        <input id="ringRxSlider" type="range" min="20" max="60" step="1" value="52">
      </label>
      <label class="debug__row">
        <span>Ring roll <output id="ringRollOut">-9°</output></span>
        <input id="ringRollSlider" type="range" min="-30" max="30" step="1" value="-9">
      </label>
      <label class="debug__row">
        <span>Ring tilt <output id="ringTiltOut">1.00×</output></span>
        <input id="ringTiltSlider" type="range" min="0.4" max="1.8" step="0.05" value="1">
      </label>
      <label class="debug__row">
        <span>Perspective <output id="perspectiveOut">2.20</output></span>
        <input id="perspectiveSlider" type="range" min="1.2" max="5" step="0.05" value="2.2">
      </label>
      <label class="debug__row">
        <span>Ring Y offset <output id="ringCyOut">0px</output></span>
        <input id="ringCySlider" type="range" min="-80" max="80" step="1" value="0">
      </label>
      <label class="debug__row">
        <span>Ring card size <output id="ringCardOut">1.00×</output></span>
        <input id="ringCardSlider" type="range" min="0.6" max="1.5" step="0.05" value="1">
      </label>
      <label class="debug__row">
        <span>Front boost <output id="frontBoostOut">1.00</output></span>
        <input id="frontBoostSlider" type="range" min="1" max="2" step="0.05" value="1">
      </label>
      <label class="debug__row">
        <span>Back shrink <output id="backShrinkOut">1.00</output></span>
        <input id="backShrinkSlider" type="range" min="0.3" max="1" step="0.05" value="1">
      </label>
      <label class="debug__check">
        <input id="anchorPick" type="checkbox"> Pick phone anchor
      </label>
      <label class="debug__check">
        <input id="hitOutline" type="checkbox"> Show card hit areas
      </label>
    </aside>
    <div class="debug-overlay" id="debugOverlay" hidden></div>
  </div>

  <script src="/app.js" defer></script>
</body>
</html>
